# SEO and repository audits, plus the metrics and advice derived from
# them. Everything here is read-only against the outside world: the only
# write is the engine's own state branch.
name: Weekly audit

on:
  workflow_dispatch:
  schedule:
    # Mondays 07:23 UTC, after the daily collection has run.
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: sge-state
  cancel-in-progress: false

env:
  STATE_FILE: .state/state/research_keys.ndjson

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the state branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state
          path: .state

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate configuration
        run: python agents/controller/main.py config-check

      - name: Run tests
        run: python -m pytest

      - name: Initialise the database
        run: python agents/controller/main.py init

      - name: Restore collection state
        run: |
          python agents/controller/main.py state-import \
            --path "$STATE_FILE" --allow-missing

      - name: Apply the current configuration to stored items
        # State carries the verdicts of whatever configuration was
        # current when it was written: without this, a keyword change
        # only ever affects items collected afterwards.
        run: python agents/research/main.py rescore

      - name: Audit the site
        run: python agents/seo/main.py audit --check-links

      - name: Site report
        run: python agents/seo/main.py report

      - name: Audit the repository
        env:
          # Read-only use: raises the API rate limit, no write scope.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python agents/github/main.py audit

      - name: Repository report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python agents/github/main.py report

      - name: Scan community threads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python agents/community/main.py scan

      - name: Record metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python agents/analytics/main.py collect

      - name: Weekly report
        run: python agents/analytics/main.py report --period weekly

      - name: Derive recommendations
        run: python agents/optimization/main.py analyse

      - name: Optimisation report
        run: python agents/optimization/main.py report

      - name: Build the dashboard
        run: python agents/dashboard/main.py build

      # Every report on the run's own page, so a weekly audit can be read
      # without downloading the artifact. `!cancelled()` so a failure part
      # way through still shows the reports that did get written.
      - name: Put the reports on the run page
        if: ${{ !cancelled() }}
        run: |
          for kind in seo github weekly optimisation; do
            report=$(ls -1t "analytics/reports/$kind"-*.md 2>/dev/null | head -1)

            if [ -z "$report" ]; then
              echo "No $kind report was written." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # Four reports share the summary's 1 MiB budget; the full text
            # stays in the artifact.
            head -c 150000 "$report" >> "$GITHUB_STEP_SUMMARY"
            printf '\n\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Save state
        run: |
          python agents/controller/main.py state-export --path "$STATE_FILE"

      - name: Commit state
        working-directory: .state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- state/; then
            echo 'State unchanged, nothing to commit.'
            exit 0
          fi

          git add state/
          git commit -m "State after audit ${{ github.run_id }}"
          git push origin HEAD:state

      # To serve the dashboard at
      # safetylab.github.io/ShadowSecurityScanner-GrowthEngine, create the
      # branch and turn Pages on once, then remove the `if: false` below:
      #
      #   git worktree add --orphan -b gh-pages /tmp/pages
      #   cp analytics/dashboard.html /tmp/pages/index.html
      #   touch /tmp/pages/.nojekyll
      #   (cd /tmp/pages && git add -A && git commit -m 'Dashboard' \
      #      && git push origin gh-pages)
      #   gh api -X POST repos/{owner}/{repo}/pages \
      #      -f 'source[branch]=gh-pages' -f 'source[path]=/'
      #
      # Note this repository is public, so the dashboard — including the
      # open findings of each audit — becomes public with it.
      - name: Check out the Pages branch
        if: false
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: .pages

      - name: Publish the dashboard to Pages
        if: false
        # The branch is checked out by actions/checkout above, which
        # keeps the token out of a command line and out of any log.
        working-directory: .pages
        run: |
          cp ../analytics/dashboard.html index.html
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- index.html; then
            echo 'Dashboard unchanged.'
            exit 0
          fi

          git add index.html
          git commit -m "Dashboard after audit ${{ github.run_id }}"
          git push origin HEAD:gh-pages

      - name: Upload reports and dashboard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-output
          path: |
            analytics/
            logs/
          if-no-files-found: ignore
          retention-days: 30
