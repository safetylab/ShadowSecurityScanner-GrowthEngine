# Collection state lives on the `state` branch as NDJSON, because a
# runner keeps nothing: without it every run would report all items as
# new. The state round-trip was verified over four manual runs before
# the schedule below was enabled.
name: Research collection

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Parse sources without writing state
        type: boolean
        default: false
  schedule:
    # 06:17 UTC daily. GitHub queues scheduled runs and may start them
    # late under load, which is fine: collection is idempotent.
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  # SQLite tolerates exactly one writer, and so does the state branch.
  group: sge-state
  cancel-in-progress: false

env:
  STATE_FILE: .state/state/research_keys.ndjson

jobs:
  collect:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 and we want
    # reproducible runs, not a surprise image change.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Write is needed to push collection state, and only to the `state`
    # branch: the push step below names that branch explicitly.
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the state branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state
          path: .state

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate configuration
        run: python agents/controller/main.py config-check

      - name: Run tests
        run: python -m pytest

      - name: Initialise the database
        run: python agents/controller/main.py init

      - name: Restore collection state
        run: |
          python agents/controller/main.py state-import \
            --path "$STATE_FILE" --allow-missing

      - name: Apply the current configuration to stored items
        # State carries the verdicts of whatever configuration was
        # current when it was written: without this, a keyword change
        # only ever affects items collected afterwards.
        run: python agents/research/main.py rescore

      - name: Collect sources
        # Through the environment rather than interpolated into the
        # script: the same rule as any other workflow input.
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python agents/research/main.py collect --dry-run
          else
            python agents/research/main.py collect
          fi

      - name: Write report
        if: ${{ inputs.dry_run != true }}
        run: python agents/research/main.py report --days 7

      # Visibility without downloading an artifact: the report lands on the
      # run's own page. `!cancelled()` so a failed earlier step still shows
      # whatever was collected.
      - name: Put the report on the run page
        if: ${{ !cancelled() && inputs.dry_run != true }}
        run: |
          report=$(ls -1t analytics/reports/research-*.md 2>/dev/null | head -1)

          if [ -z "$report" ]; then
            echo 'No report was written.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The summary is capped at 1 MiB; 200 KB of one report is plenty
          # and the full text stays in the artifact.
          head -c 200000 "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Save collection state
        if: ${{ inputs.dry_run != true }}
        run: |
          python agents/controller/main.py state-export --path "$STATE_FILE"

      - name: Commit state
        if: ${{ inputs.dry_run != true }}
        working-directory: .state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- state/; then
            echo 'State unchanged, nothing to commit.'
            exit 0
          fi

          git add state/
          git commit -m "State after run ${{ github.run_id }}"
          git push origin HEAD:state

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-output
          path: |
            analytics/reports/
            logs/
          if-no-files-found: ignore
          retention-days: 7
