# Manual-only for now. The schedule stays commented out until state
# handling between runs is solved (see README, "State on CI"): a runner
# is temporary, so growth.db does not survive from one run to the next.
name: Research collection

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Parse sources without writing to the database
        type: boolean
        default: true

# Read-only: this workflow collects and reports, it never publishes.
permissions:
  contents: read

concurrency:
  # SQLite tolerates exactly one writer.
  group: sge-state
  cancel-in-progress: false

jobs:
  collect:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 and we want
    # reproducible runs, not a surprise image change.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate configuration
        run: python agents/controller/main.py config-check

      - name: Run tests
        run: python -m pytest

      - name: Initialise the database
        run: python agents/controller/main.py init

      - name: Collect sources
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python agents/research/main.py collect --dry-run
          else
            python agents/research/main.py collect
          fi

      - name: Write report
        if: ${{ inputs.dry_run != true }}
        run: python agents/research/main.py report --days 1

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-output
          path: |
            analytics/reports/
            logs/
          if-no-files-found: ignore
          retention-days: 7
