channels:
  website:
    enabled: true
    mode: automatic

  github:
    enabled: true
    mode: automatic
    actions:
      - release_notes
      - documentation_updates

  rss:
    enabled: true
    mode: automatic

  telegram:
    enabled: false
    mode: manual

  reddit:
    enabled: true
    mode: automatic
    # Subreddits whose rules allow a project author to post releases.
    # Adding one here is a claim that its rules have been read.
    targets:
      - netsec

  hackernews:
    enabled: true
    mode: draft_only

  linkedin:
    enabled: true
    mode: automatic

  x:
    enabled: true
    mode: automatic
